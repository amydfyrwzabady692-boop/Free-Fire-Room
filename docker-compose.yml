services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ffroom}
      POSTGRES_USER: ${POSTGRES_USER:-ffroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - effective_cache_size=128MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ffroom} -d ${POSTGRES_DB:-ffroom}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 64m
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    command:
      - sh
      - -c
      - |
        set -e
        echo "migrate: alembic current"
        alembic current
        echo "migrate: alembic upgrade"
        alembic upgrade head
        echo "migrate: bootstrap"
        python -m app.cli.main bootstrap
        echo "migrate: done"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --timeout-keep-alive
      - "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    mem_limit: 192m
    restart: unless-stopped

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    command: ["python", "-m", "app.bot.runner"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - -B
      - -l
      - warning
      - -Q
      - default,telegram,credentials,broadcasts
      - --pool=solo
      - --concurrency=1
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
      NODE_OPTIONS: --max-old-space-size=128
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 160m
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend
    mem_limit: 32m
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
