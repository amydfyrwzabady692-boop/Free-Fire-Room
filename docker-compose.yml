x-python-env: &python-env
  MALLOC_ARENA_MAX: "1"
  PYTHONMALLOC: malloc
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  BOT_EMBEDDED: "true"
  DEBUG: "false"
  LOG_LEVEL: WARNING
  JOB_DISPATCH_INTERVAL_SECONDS: "60"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ffroom}
      POSTGRES_USER: ${POSTGRES_USER:-ffroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=48MB
      - -c
      - max_connections=20
      - -c
      - wal_buffers=1MB
    mem_limit: 64m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ffroom} -d ${POSTGRES_DB:-ffroom}"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 12mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    mem_limit: 20m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      <<: *python-env
    command:
      - sh
      - -c
      - |
        set -e
        echo "migrate: alembic current"
        alembic current
        echo "migrate: alembic upgrade"
        alembic upgrade head
        echo "migrate: bootstrap"
        python -m app.cli.main bootstrap
        echo "migrate: done"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      <<: *python-env
    mem_limit: 384m
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --log-level
      - warning
      - --no-access-log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  bot:
    profiles: ["bot"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      <<: *python-env
      BOT_EMBEDDED: "false"
      TELEGRAM_MODE: polling
      LOG_LEVEL: INFO
    command: ["python", "-m", "app.bot.runner"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
      NODE_OPTIONS: --max-old-space-size=48
    mem_limit: 64m
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    mem_limit: 12m
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
